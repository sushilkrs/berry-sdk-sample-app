<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BerryDB SDK Sample App</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="logo">B</span>
    <div>
      <h1>BerryDB SDK Sample App</h1>
      <p>Students upload documents · BerryDB extracts them · one profile per student</p>
    </div>
  </a>
  <div class="sources">
    <span>Data from:</span>
    <span class="src app" title="This app's own database: SQLite file data/app.db (tables students, documents)">App DB</span>
    <span class="src berry" title="BerryDB database ResumePlaygroundKG: one record per uploaded PDF">BerryDB · documents</span>
    <span class="src prof" title="BerryDB database StudentProfiles: one record per student, id = student UUID">BerryDB · profiles</span>
    <div id="conn" class="conn"><span class="dot"></span><span>Checking BerryDB…</span></div>
  </div>
</header>

<main id="view"></main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
